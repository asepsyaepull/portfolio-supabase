name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 43.133.151.199
          username: ubuntu
          key: ${{ secrets.DEPLOY_KEY }}
          script: /home/ubuntu/portfolio/scripts/deploy.sh
